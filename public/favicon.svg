<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Outer Circular Stroke with brand terracotta tone -->
  <circle cx="100" cy="100" r="94" stroke="#6E3F3A" stroke-width="6" />
  <!-- Inner subtle concentric guideline -->
  <circle cx="100" cy="100" r="86" stroke="#6E3F3A" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4" />

  <!-- Stylized organic lettering based on Kurush Yarn handwriting -->
  <g fill="#392220">
